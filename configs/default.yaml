# TBRGS Default Configuration

data:
  raw_path: "data/raw/"
  processed_path: "data/processed/"
  sequence_length: 12        # Number of time steps for input (12 x 15min = 3 hours)
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

model:
  lstm:
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.001
    epochs: 100
    batch_size: 32

  gru:
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.001
    epochs: 100
    batch_size: 32

  third_model:
    # Configure your third model here
    learning_rate: 0.001
    epochs: 100
    batch_size: 32

routing:
  speed_limit_kmh: 60
  intersection_delay_sec: 30
  top_k: 5
